<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Checker</title>
</head>
<body>

    <script>
        let age = prompt("Enter your age:");

        if (age >= 18) {
            document.write("<h1>Eligible to vote</h1>");
            document.write("<h1>Eligible to drive</h1>");
            document.write("<h1>Eligible to enter university</h1>");
        } else {
            alert("You are not eligible yet!");
        }
    </script>

</body>
</html>
